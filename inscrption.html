<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscription Nouveau client - Méditerrannée</title>
</head>
<body>
	<header>
		<h1>Inscription d'un Nouveau client</h1>
	</header>

	<section>
		<form action="#" method="post">
		
		<label for="nom">Nom :</label>
		<input type="text" id="nom" name="nom">
		<br>
		<br>
		<br>
		<label for="prenom">Prénom :</label>
		<input type="text" id="prenom" name="prenom">
		<br>
		<br>
		<br>
		<label for="date_naissance">Date de naissance :</label>
		<input type="date" id="date_naissance" name="date_naissance">
		<br>
		<br>
		<br>
		<label for="email">Adresse mail :</label>
		<input type="email" id="email" name="email">
		<br>
		<br>
		<br>
		<label for="mdp">Mot de passe :</label>
		<input type="password" id="password" name="password">
		<br>
		<br>
		<br>
		<label for="permis">Numéro de permis :</label>
		<input type="text" id="permis" name="permis">
		<br>
		<br>
		<br>
		<label for="anciennete">Nombre d'années d'ancienneté :</label>
		<input type="number" id="anciennete" name="anciennete" min="0" max="80">
		<br>
		<br>
		<br>
		<label for="ville">Ville :</label>
		<select id="ville" name="ville">
			<option value="paris">Paris</option>
			<option value="versailles">Versailles</option>
			<option value="creteil">Creteil</option>
			




		</select>
		<br>
		<br>
		<br>
		<label for="adresse">Adresse du client :</label>
		<textarea id="adresse" name="adresse" rows="4" cols="30"></textarea>
		<br>
		<br>
		<br>
		<p>Situation matrimoniale :</p>
		<label for="marie_oui">Marié</label>
		<input type="radio" id="marie_oui" name="marie_oui" value="oui">
		<label for="marie_non">Non Marié</label>
		<input type="radio" id="marie_non" name="marie_non" value="non">
		<br>
		<br>
		<br>
		<p>Préference de voiture :</p>
		<label for="pref_auto">Automatique</label>
		<input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
		<label for="pref_manuelle">Manuelle</label>
		<input type="checkbox" id="pref_auto" name="preference_manuelle" value="manuelle">
		<br>
		<br>
		<br>
		<button type="submit">Enregistrer</button>
		<button type="reset">Annuler</button>














	</form>
	</section>

	<footer>
		<p>&copy; 2026 Agence méditerrannée - Location de véhicules</p>
	</footer>
	

</body>
</html>
